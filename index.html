<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Management System</title>

<link rel="stylesheet" href="style.css">


</head>

<body>

<div class="container">

    <!-- Page Header -->
    <header>
        <h1>Student Management System</h1>
        <p>Manage student records easily</p>
    </header>

    <!-- Add Student Section -->
    <section class="form-section">

        <h2>Add Student</h2>

        <div class="input-group">

            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
                required
            >

            <input
                type="text"
                id="studentCourse"
                placeholder="Enter course"
                required
            >

            <button onclick="addStudent()">
                Add Student
            </button>

        </div>

    </section>

    <!-- Student List Section -->
    <section class="student-section">

        <h2>Student List</h2>

        <table>

            <thead>
                <tr>
                    <th>#</th>
                    <th>Student Name</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
                <!-- Students will be added here using JavaScript -->
            </tbody>

        </table>

        <!-- Message shown when there are no students -->
        <p id="emptyMessage">
            No students added yet.
        </p>

    </section>

</div>

<!-- JavaScript -->
<script src="script.js"></script>

</body>

</html>
